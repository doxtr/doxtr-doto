[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doxtr-doto"
dynamic = ["version"]
description = "Documentation task management for Sphinx"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "doto contributors" }
]
keywords = ["sphinx", "documentation", "tasks", "todo", "project-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Plugins",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "sphinx>=7.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.0",
    "rich>=13.0",
    "tomli>=2.0;python_version<'3.11'",
    "tomli-w>=1.0",
]
templates = [
    "jinja2>=3.0",
]
charts = [
    "plotly>=5",
    "kaleido",
]
tui = [
    "textual>=0.60",
]
xlink = [
    "doxtr-xlink>=2.0",
]
calendar = [
    # Generic CalDAV + Apple iCloud (pulls in icalendar/vobject/lxml).
    "caldav>=1.3",
    # RFC 5545 VEVENT/VTODO (de)serialization.
    "icalendar>=5.0",
    # Google Calendar REST API + OAuth2.
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.30",
    # Microsoft Graph OAuth2.
    "msal>=1.28",
    "requests>=2.28",
    # Rich-text body conversion between the local Markdown store and the HTML
    # subset Google Calendar renders (both have graceful regex fallbacks, so
    # they are soft requirements -- declared here for the best-quality path).
    "markdown>=3.4",
    "beautifulsoup4>=4.11",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Exact pin: ruff's formatter output changes between versions, so keep every
    # contributor in lockstep to avoid repo-wide format drift. Bump deliberately.
    "ruff==0.16.9",
    "mypy>=1.0",
    "jinja2>=3.0",
]
all = [
    "doxtr-doto[cli,templates,charts,tui,xlink,calendar,dev]",
]

[project.scripts]
doto = "doxtr_doto.cli.main:main"

[project.urls]
Homepage = "https://github.com/doxtr/doxtr-doto"
Documentation = "https://doxtr-doto.readthedocs.io"
Repository = "https://github.com/doxtr/doxtr-doto"
Issues = "https://github.com/doxtr/doxtr-doto/issues"

[tool.hatch.version]
path = "src/doxtr_doto/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/doxtr_doto"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DTZ", "T10", "ISC"]
# E501: line length handled by formatter / allowed to exceed.
# DTZ: doto intentionally models due dates and schedules as naive LOCAL
#      calendar dates (see date_utils.py / charts.py). Making these tz-aware
#      would change behavior, so timezone-aware datetime rules are disabled.
ignore = ["E501", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# cli/main.py registers Click subcommands after the top-level `cli` group is
# defined. The command modules import back from cli.main (e.g. DotoContext),
# so these registration imports must stay below the group definition to avoid
# a circular import. E402 is expected and intentional here.
"src/doxtr_doto/cli/main.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

# Third-party libraries without type stubs or a py.typed marker. mypy cannot
# analyze these, so we silence the missing-import noise rather than scatter
# per-import `# type: ignore` comments across the codebase.
[[tool.mypy.overrides]]
module = [
    "docutils.*",
    "plotly.*",
    "kaleido.*",
    "tomli",
    "doxtr_xlink.*",
    "doxtr_pdf_theme_core.*",
    "doxtr.pdf_theme_core.*",
    "caldav.*",
    "icalendar.*",
    "googleapiclient.*",
    "google.*",
    "google_auth_oauthlib.*",
    "msal.*",
    "requests.*",
    "markdown",
    "markdown.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=doxtr_doto --cov-report=term-missing --cov-fail-under=80"
