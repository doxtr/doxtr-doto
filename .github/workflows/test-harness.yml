name: Test Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with all extras
        # The circular-import check imports every module, including the
        # click-based CLI, so the cli extras must be present. `all` pulls in
        # cli, templates, and dev.
        run: pip install -e ".[all]" || pip install -e ".[dev]" || pip install -e .

      - name: Install doxtr-pdf-theme-core
        # Mirrors test.yml: install the optional integration core so Features 3
        # and 6 (semantic-color derivation + landscape rotation) are exercised
        # across the version matrix and the --cov-fail-under=80 gate keeps its
        # margin (integration/doxtr.py otherwise runs with lower coverage and
        # test_integration_doxtr.py's core-dependent cases skip entirely).
        run: pip install "doxtr-pdf-theme-core>=1.1.9"

      - name: Check for circular imports
        run: python scripts/check_imports.py

      - name: Run unit tests with coverage
        # --cov-report=xml is passed here because this job uploads coverage.xml
        # as an artifact (see "Upload coverage report" step). All other coverage
        # flags (--cov, --cov-fail-under, -v, --tb) come from pyproject.toml
        # [tool.pytest.ini_options] addopts, which is the single source of truth
        # for the coverage gate — do not "consolidate" this xml flag away.
        run: python -m pytest tests/ --cov-report=xml

      - name: Verify import
        run: python -c "import doxtr_doto; print(doxtr_doto.__version__)"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
